aid: study-edge
name: Study Edge
description: Study Edge is an education technology company that builds online learning, tutoring, and
  test-preparation platforms for students. Its products deliver on-demand instructional video, live and
  scheduled study sessions, practice problems, and course-specific study resources, and the company is
  known for operating statewide math learning platforms such as Algebra Nation / Math Nation. Study Edge
  is a consumer- and institution-facing learning service rather than a developer platform; as of this
  profile it publishes no public developer API, SDK, or API documentation. It is tracked in the API Evangelist
  network as an a16z portfolio company.
